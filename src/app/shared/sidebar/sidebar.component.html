<aside class="sidebar">
  <!-- Brand / Logo Section -->
  <div class="brand-section">
    <div class="brand-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40">
        <!-- Dark green rounded background -->
        <rect x="2" y="2" width="20" height="20" rx="6" fill="#1b4332" />
        <!-- White/light green leaf-like shape inside -->
        <path d="M12 6c-3.3 0-6 2.7-6 6 0 2.2 1.2 4.1 3 5.2V19c0 .6.4 1 1 1h4c.6 0 1-.4 1-1v-1.8c1.8-1.1 3-3 3-5.2 0-3.3-2.7-6-6-6zm-1 12h2v1h-2v-1zm1.5-3.2c-.3.3-.5.7-.5 1.2h-2c0-.5-.2-.9-.5-1.2-1-1-1.5-2-1.5-3 0-2.2 1.8-4 4-4s4 1.8 4 4c0 1-.5 2-1.5 3z" fill="#a3e635" />
      </svg>
    </div>
    <div class="brand-info">
      <span class="brand-name">BillingApp</span>
      <span class="brand-tagline">PURCHASE LEDGER</span>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">
        <!-- Grid Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
      </span>
      <span class="nav-text">Dashboard</span>
    </a>

    <div class="nav-dropdown-container">
      <div class="nav-dropdown-trigger" (click)="toggleMasters()">
        <span class="nav-icon">
          <!-- Folder Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="20" height="20" style="color: #64748b;">
            <path d="M19.5 21a3 3 0 0 0 3-3v-7.5a3 3 0 0 0-3-3h-6.38l-1.72-2.29a1.5 1.5 0 0 0-1.2-.61H4.5A3 3 0 0 0 1.5 7.5v10.5a3 3 0 0 0 3 3h15z" />
          </svg>
        </span>
        <span class="nav-text">Masters</span>
        <span class="nav-arrow">
          <!-- Chevron Down / Up Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" width="14" height="14" [style.transform]="isMastersOpen ? 'rotate(180deg)' : 'rotate(0)'" style="transition: transform 0.2s ease; color: #64748b;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </span>
      </div>

      @if (isMastersOpen) {
        <div class="submenu-container">
          <a class="submenu-link" routerLink="/product-entries" routerLinkActive="active">
            <span class="submenu-icon">
              <!-- Building/Hotel icon with window matrix -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <rect x="4" y="2" width="16" height="20" rx="1.5" />
                <line x1="8" y1="6" x2="10" y2="6" />
                <line x1="14" y1="6" x2="16" y2="6" />
                <line x1="8" y1="10" x2="10" y2="10" />
                <line x1="14" y1="10" x2="16" y2="10" />
                <line x1="8" y1="14" x2="10" y2="14" />
                <line x1="14" y1="14" x2="16" y2="14" />
                <line x1="8" y1="18" x2="10" y2="18" />
                <line x1="14" y1="18" x2="16" y2="18" />
              </svg>
            </span>
            <span class="submenu-text">Products-Entrys</span>
          </a>

          <a class="submenu-link" routerLink="/barcode-printer" routerLinkActive="active">
            <span class="submenu-icon">
              <!-- Vegetable shape icon matching the image: cloud outline + dot in middle -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M12 6.5c-1 0-1.8.8-1.8 1.8 0 .4.2.8.5 1.1-.3.3-.5.7-.5 1.1 0 1 .8 1.8 1.8 1.8s1.8-.8 1.8-1.8c0-.4-.2-.8-.5-1.1.3-.3.5-.7.5-1.1 0-1-.8-1.8-1.8-1.8z" />
                <path d="M12 4c-2.2 0-4 1.8-4 4 0 1 .4 1.9 1 2.6-.6.7-1 1.6-1 2.6 0 2.2 1.8 4 4 4s4-1.8 4-4c0-1-.4-1.9-1-2.6.6-.7 1-1.6 1-2.6 0-2.2-1.8-4-4-4z" />
                <circle cx="12" cy="11" r="1.5" fill="currentColor" />
              </svg>
            </span>
            <span class="submenu-text">Barcode Printer</span>
          </a>
        </div>
      }
    </div>
  </nav>

  <!-- Sidebar Add Button -->
  <div class="sidebar-actions">
    <button class="btn-sidebar-add" routerLink="/daily-entry">
      <span class="btn-plus-icon">+</span> Add Entry
    </button>
  </div>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    V1.0 - ONLINE READY
  </div>
</aside>
