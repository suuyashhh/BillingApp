<div class="product-page">
  <!-- Page Header Row -->
  <div class="page-header">
    <div class="header-left">
      <span class="master-badge">MASTER</span>
      <h1 class="page-title">Product Entries</h1>
    </div>
    <div class="header-right">
      <button class="btn-add-product" (click)="openDrawer()">
        <span class="plus-icon">+</span> Add Product
      </button>
    </div>
  </div>

  <!-- Search Filter Grid -->
  <div class="filter-section">
    <div class="search-box">
      <span class="search-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search products by name or barcode..." class="search-input" />
    </div>
  </div>

  <!-- Product Cards Grid -->
  <div class="products-grid">
    <div class="product-card" *ngFor="let product of filteredProducts(); let i = index">
      <div class="card-left">
        <div class="product-icon">
          <!-- Vegetable Wavy Outline Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
            <path d="M12 6.5c-1 0-1.8.8-1.8 1.8 0 .4.2.8.5 1.1-.3.3-.5.7-.5 1.1 0 1 .8 1.8 1.8 1.8s1.8-.8 1.8-1.8c0-.4-.2-.8-.5-1.1.3-.3.5-.7.5-1.1 0-1-.8-1.8-1.8-1.8z" />
            <path d="M12 4c-2.2 0-4 1.8-4 4 0 1 .4 1.9 1 2.6-.6.7-1 1.6-1 2.6 0 2.2 1.8 4 4 4s4-1.8 4-4c0-1-.4-1.9-1-2.6.6-.7 1-1.6 1-2.6 0-2.2-1.8-4-4-4z" />
            <circle cx="12" cy="11" r="1.5" fill="currentColor" />
          </svg>
        </div>
        <div class="product-details">
          <h3 class="product-name">{{ product.englishName }} - {{ product.marathiName }}</h3>
          <div class="product-meta">
            <span class="meta-item"><strong class="meta-label">Qty:</strong> {{ product.quantity }}</span>
            <span class="meta-divider">|</span>
            <span class="meta-item"><strong class="meta-label">Price:</strong> ₹{{ product.price }}</span>
            <span class="meta-divider">|</span>
            <span class="meta-item"><strong class="meta-label">Barcode:</strong> {{ product.barcode || 'N/A' }}</span>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-action btn-edit" title="Edit Product">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
        </button>
        <button class="btn-action btn-delete" (click)="deleteProduct(i)" title="Delete Product">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="filteredProducts().length === 0">
      <p>No products found. Click "+ Add Product" to create one.</p>
    </div>
  </div>

  <!-- Right Side Form Drawer Panel -->
  <div class="drawer-backdrop" *ngIf="isDrawerOpen" (click)="closeDrawer()"></div>
  
  <div class="drawer-panel" [class.open]="isDrawerOpen">
    <div class="drawer-header">
      <h2 class="drawer-title">Add Product</h2>
      <button class="btn-drawer-close" (click)="closeDrawer()">&times;</button>
    </div>

    <div class="drawer-body">
      <div class="form-group">
        <label class="form-label">ENGLISH NAME <span class="required">*</span></label>
        <input type="text" [(ngModel)]="englishName" placeholder="e.g. Carrot" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">MARATHI NAME</label>
        <input type="text" [(ngModel)]="marathiName" placeholder="e.g. गाजर" class="form-input" />
      </div>

      <div class="form-group-row">
        <div class="form-group col">
          <label class="form-label">QUANTITY</label>
          <input type="number" [(ngModel)]="quantity" placeholder="e.g. 10" class="form-input" />
        </div>

        <div class="form-group col">
          <label class="form-label">PRICE (₹)</label>
          <input type="number" [(ngModel)]="price" placeholder="e.g. 50" class="form-input" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">BARCODE NO</label>
        <input type="text" [(ngModel)]="barcode" placeholder="e.g. 890123456789" class="form-input" />
      </div>
    </div>

    <div class="drawer-footer">
      <button class="btn-footer-cancel" (click)="closeDrawer()">Cancel</button>
      <button class="btn-footer-save" [disabled]="!englishName" (click)="saveProduct()">Save Product</button>
    </div>
  </div>
</div>
